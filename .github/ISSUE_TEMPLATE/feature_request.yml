name: Feature request
description: Suggest an improvement for the CheatMD CLI.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow should be easier?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should CheatMD do?
    validations:
      required: true
