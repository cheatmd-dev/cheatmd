name: Bug report
description: Report a problem with the CheatMD CLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
    validations:
      required: true

  - type: input
    id: cheatmd-version
    attributes:
      label: CheatMD version
      description: Output of `cheatmd --version`.

  - type: input
    id: os
    attributes:
      label: Operating system

  - type: input
    id: shell
    attributes:
      label: Shell
      description: e.g. bash, zsh, fish

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste error messages or relevant output. Remove private paths or cheat content first.
      render: text
